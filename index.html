
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Supermarket VR</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>
<a-scene background="color: #ECECEC">

  <!-- Floor -->
  <a-plane
    position="0 0 -10"
    rotation="-90 0 0"
    width="12"
    height="30"
    color="#DDDDDD">
  </a-plane>

  <!-- Ceiling -->
  <a-box
    position="0 4 -10"
    width="12"
    height="0.2"
    depth="30"
    color="#FFFFFF">
  </a-box>

  <!-- Left supermarket shelves -->
  <a-entity id="left-shelves"></a-entity>

  <!-- Right supermarket shelves -->
  <a-entity id="right-shelves"></a-entity>

  <!-- FIRST AD SCREEN: LEFT SIDE -->
  <a-entity position="-1.78 2 -4" rotation="0 25 0">

    <a-box
      width="1.5"
      height="1"
      depth="0.08"
      color="#222222">
    </a-box>

    <a-plane
      position="0 0 0.05"
      width="1.4"
      height="0.9"
      color="#4CC3D9">
    </a-plane>

    <a-text
      value="FRESH DEALS!"
      position="0 0.15 0.07"
      align="center"
      color="#FFFFFF"
      width="2.8">
    </a-text>

    <a-text
      value="SAVE 20% TODAY"
      position="0 -0.2 0.07"
      align="center"
      color="#FFFFFF"
      width="2.3">
    </a-text>

  </a-entity>

  <!-- SECOND AD SCREEN: RIGHT SIDE -->
  <a-entity position="1.78 2 -5" rotation="0 -25 0">

    <a-box
      width="1.5"
      height="1"
      depth="0.08"
      color="#222222">
    </a-box>

    <a-plane
      position="0 0 0.05"
      width="1.4"
      height="0.9"
      color="#FF69B4">
    </a-plane>

    <a-text
      value="SPECIAL OFFER!"
      position="0 0.15 0.07"
      align="center"
      color="#FFFFFF"
      width="2.8">
    </a-text>

    <a-text
      value="SHOP & SAVE!"
      position="0 -0.2 0.07"
      align="center"
      color="#FFFFFF"
      width="2.3">
    </a-text>

  </a-entity>

  <!-- Camera -->
  <a-entity
    camera
    look-controls
    wasd-controls
    position="0 1.6 2">
  </a-entity>

  <!-- Lighting -->
  <a-light
    type="ambient"
    intensity="0.9"
    color="#FFFFFF">
  </a-light>

  <a-light
    type="directional"
    position="0 5 -5"
    intensity="0.6">
  </a-light>

  <a-sky color="#ECECEC"></a-sky>

</a-scene>

<script>
  const colors = [
    "#EF2D5E",
    "#FFC65D",
    "#4CC3D9",
    "#7BC8A4",
    "#A569BD",
    "#F39C12"
  ];

  function makeShelf(side, z) {
    const shelf = document.createElement("a-entity");

    const x = side === "left" ? -2.5 : 2.5;

    // Shelf structure
    const frame = document.createElement("a-box");
    frame.setAttribute("position", `${x} 1.8 ${z}`);
    frame.setAttribute("width", "1.2");
    frame.setAttribute("height", "3.6");
    frame.setAttribute("depth", "3.8");
    frame.setAttribute("color", "#B0B0B0");
    shelf.appendChild(frame);

    // Shelf levels
    for (let level = 0; level < 5; level++) {
      const y = 0.4 + level * 0.7;

      const board = document.createElement("a-box");
      board.setAttribute("position", `${x} ${y} ${z}`);
      board.setAttribute("width", "1.4");
      board.setAttribute("height", "0.08");
      board.setAttribute("depth", "3.8");
      board.setAttribute("color", "#666666");
      shelf.appendChild(board);

      // Products
      for (let i = 0; i < 10; i++) {
        const product = document.createElement("a-box");

        const productX =
          side === "left" ? x + 0.48 : x - 0.48;

        const productZ = z - 1.65 + i * 0.36;

        product.setAttribute(
          "position",
          `${productX} ${y + 0.28} ${productZ}`
        );

        product.setAttribute("width", "0.26");
        product.setAttribute("height", "0.5");
        product.setAttribute("depth", "0.27");

        product.setAttribute(
          "color",
          colors[(i + level) % colors.length]
        );

        shelf.appendChild(product);
      }
    }

    const container = document.querySelector(
      side === "left"
        ? "#left-shelves"
        : "#right-shelves"
    );

    container.appendChild(shelf);
  }

  // Extend shelves down the aisle
  for (let z = -2; z >= -22; z -= 4) {
    makeShelf("left", z);
    makeShelf("right", z);
  }
</script>

</body>
</html>
